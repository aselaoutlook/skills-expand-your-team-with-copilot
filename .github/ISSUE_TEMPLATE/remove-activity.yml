name: Remove an Activity
description: Request to remove an existing activity or club from the website.
title: "Remove activity: [Activity Name]"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to request that an activity be removed from the Mergington High School Activities website.
        The activity will no longer appear on the site and students will not be able to sign up for it.

  - type: input
    id: activity-name
    attributes:
      label: Activity Name
      description: The exact name of the activity as it currently appears on the website.
      placeholder: "e.g. Drama Club"
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason for Removal
      description: Why should this activity be removed? (e.g. the club is no longer running, the teacher has left, etc.)
      placeholder: "e.g. The club is not running this semester due to the teacher's absence."
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      description: Please confirm you understand what this change will do.
      options:
        - label: I understand this will permanently remove the activity and all student sign-up data from the website.
    validations:
      required: true
